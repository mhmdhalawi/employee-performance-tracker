[project]
name = "tracker"
version = "0.1.0"
description = "Employee Performance Tracking Agent — backend service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.7.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "openai>=1.60.0",
    "pydantic-ai-slim[openai]>=2.27.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

# Flat layout: the package is `app/` at the repo root, not `src/<name>/`.
[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

# Style rules from AGENTS.md section 10, enforced mechanically instead of by prose.
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes: unused imports and names
    "W",    # pycodestyle warnings
    "I",    # isort: import ordering
    "UP",   # pyupgrade: modern syntax (str | None, list[X])
    "B",    # bugbear
    "SIM",  # simplify
    "T20",  # no print in library code
    "RUF",
]
# Every remaining long line sits inside a SQL or message string literal that cannot be
# split without hurting readability; line length is left to the formatter.
ignore = ["E501"]
